# ========== 全局配置 ==========
log_dir=/var/log/track
log_size=1024                   # 单个日志文件大小（KB）；track.log 与 dmesg.log 共用
log_count=5                     # 日志保留份数；track.log 与 dmesg.log 共用
check_interval=1               # 存活检测间隔（秒）；CPU 采样/扫描/快照窗口也跟随此间隔
heartbeat_interval=60          # 心跳日志间隔（秒）
startup_grace=15               # 启动宽限期（秒），此期间只检测不拉起
rapid_death_window=30          # 快速崩溃判定窗口（秒），拉起后此时间内死亡算快速崩溃
circuit_break_threshold=3      # 连续崩溃多少次后重启系统

# ========== CPU 监控 ==========
cpu_monitor_enable=1           # 总开关：1=开启
cpu_log_interval=300           # 正常态周期概览日志间隔（秒），告警中自动降为 60s
cpu_total_threshold=85         # 整机归一化% 告警阈值（0~100），唯一告警条件
cpu_alert_duration=3           # 连续几次超阈值才告警/恢复（去抖，防毛刺）
cpu_snapshot_on_alert=1        # 告警时是否拍全系统 TOP N 进程快照
cpu_snapshot_cooldown=60       # 两次快照最小间隔（秒），防刷盘
cpu_top_n=5                    # 快照取 CPU 最高的前 N 个进程

# ========== 内存监控 ==========
mem_monitor_enable=1            # 总开关：1=开启
mem_log_interval=300            # 正常态周期概览日志间隔（秒），告警中自动降为 60s
mem_available_threshold_mb=40   # MemAvailable 低于此值(MB)告警；512MB 设备 OOM 边界约 10-20MB
mem_alert_duration=5            # 连续几次低于阈值才告警/恢复（去抖，内存比 CPU 更抖）
mem_snapshot_on_alert=1         # 告警时是否拍 RSS TOP N 进程快照
mem_snapshot_cooldown=60        # 两次快照最小间隔（秒），防刷盘
mem_top_n=5                     # 快照取 RSS 最高的前 N 个进程

# ========== Flash 监控 ==========
flash_monitor_enable=1          # 总开关：1=开启
flash_log_interval=300          # 正常态周期概览日志间隔（秒），告警中自动降为 60s
flash_paths=/userdata /oem      # 监控路径（空格分隔）；同文件系统(f_fsid)只告警一次，只读分区自动跳过
flash_used_pct_threshold=90     # 已用百分比告警阈值（0~100，按非 root 可用空间 f_bavail 计算）
flash_alert_duration=2          # 连续几次超阈值才告警/恢复（去抖，闪存变化慢）
flash_snapshot_on_alert=1       # 告警时是否拍 log_dir 下最大文件 TOP N 快照
flash_snapshot_cooldown=60      # 两次快照最小间隔（秒），防刷盘
flash_top_n=5                   # 快照取最大的前 N 个文件

# ========== 被监控进程 ==========
# video 有 pidfile，用 pidfile + comm 校验
[process:video]
pidfile=/var/run/video.pid
comm=video
restart_cmd=/usr/bin/video.sh restart
restart_delay=1

# audio 有 pidfile（由 audio.sh 生成），用 pidfile + comm 校验
[process:audio]
pidfile=/var/run/audio.pid
comm=audio
restart_cmd=/usr/bin/audio.sh restart
restart_delay=1
